apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-learning-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-learning
  template:
    metadata:
      labels:
        app: k8s-learning
    spec:
      containers:
        - name: k8s-learning-container
          image: nginxdemos/hello
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-learning-service
spec:
  selector:
    app: k8s-learning
  ports:
    - port: 80
      targetPort: 80
